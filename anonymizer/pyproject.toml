[project]
name = "brikko-anonymizer"
version = "0.3.0"
description = "Brikko Studio Anonymizer sidecar (M1 — PII masking core)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32,<0.40",
  "redis>=5.0,<7.0",
  "natasha>=1.6,<2.0",
  "python-json-logger>=2.0,<4.0",
  "cryptography>=43.0,<48.0",
  "keyring>=25.4,<26.0",
  "argon2-cffi>=23.1,<25.0",
  "psutil>=6.0,<8.0",
  "aiosqlite>=0.20,<0.22",
  "sqlalchemy>=2.0,<2.1",
  "pyyaml>=6.0,<7.0",
  # natasha pulls in pymorphy2, which still imports pkg_resources at runtime.
  # setuptools >=81 dropped pkg_resources, so pin to the last compatible
  # major. Once pymorphy2 (or its replacement, pymorphy3) drops pkg_resources
  # we can lift this. See pymorphy2#170, setuptools#4519.
  "setuptools>=70,<81",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=5.0,<7.0",
  "hypothesis>=6.112,<7.0",
  "pip-tools>=7.4,<8.0",
  "httpx>=0.27,<0.30",
  "ruff>=0.6,<0.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["brikko_anonymizer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
