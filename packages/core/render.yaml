services:
  - type: web
    name: brikko-studio
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: BRIKKO_STUDIO_GATEWAY_PORT
        value: "8080"
      - key: BRIKKO_STUDIO_STATE_DIR
        value: /data/.brikko-studio
      - key: BRIKKO_STUDIO_WORKSPACE_DIR
        value: /data/workspace
      - key: BRIKKO_STUDIO_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: brikko-studio-data
      mountPath: /data
      sizeGB: 1
