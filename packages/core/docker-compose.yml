services:
  brikko-studio-gateway:
    image: ${BRIKKO_STUDIO_IMAGE:-brikko-studio:local}
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BRIKKO_STUDIO_GATEWAY_TOKEN: ${BRIKKO_STUDIO_GATEWAY_TOKEN:-}
      BRIKKO_STUDIO_ALLOW_INSECURE_PRIVATE_WS: ${BRIKKO_STUDIO_ALLOW_INSECURE_PRIVATE_WS:-}
      # Empty means auto: Bonjour disables itself in detected containers.
      # Set 0 only on host/macvlan/mDNS-capable networks; set 1 to force off.
      BRIKKO_STUDIO_DISABLE_BONJOUR: ${BRIKKO_STUDIO_DISABLE_BONJOUR:-}
      # OpenTelemetry export is outbound OTLP/HTTP from the Gateway. Prometheus
      # uses the existing authenticated Gateway route; it does not need a port.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-}
      BRIKKO_STUDIO_OTEL_PRELOADED: ${BRIKKO_STUDIO_OTEL_PRELOADED:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${BRIKKO_STUDIO_TZ:-UTC}
    volumes:
      - ${BRIKKO_STUDIO_CONFIG_DIR:-${HOME:-/tmp}/.brikko-studio}:/home/node/.brikko-studio
      - ${BRIKKO_STUDIO_WORKSPACE_DIR:-${HOME:-/tmp}/.brikko-studio/workspace}:/home/node/.brikko-studio/workspace
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg BRIKKO_STUDIO_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with BRIKKO_STUDIO_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    # Let bundled local-model providers reach host-side LM Studio/Ollama via
    # http://host.docker.internal:<port>. Docker Desktop usually provides this
    # alias; the host-gateway mapping makes it work on Linux Docker Engine too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BRIKKO_STUDIO_GATEWAY_PORT:-18789}:18789"
      - "${BRIKKO_STUDIO_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${BRIKKO_STUDIO_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  brikko-studio-cli:
    image: ${BRIKKO_STUDIO_IMAGE:-brikko-studio:local}
    network_mode: "service:brikko-studio-gateway"
    env_file:
      - path: .env
        required: false
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BRIKKO_STUDIO_GATEWAY_TOKEN: ${BRIKKO_STUDIO_GATEWAY_TOKEN:-}
      BRIKKO_STUDIO_ALLOW_INSECURE_PRIVATE_WS: ${BRIKKO_STUDIO_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${BRIKKO_STUDIO_TZ:-UTC}
    volumes:
      - ${BRIKKO_STUDIO_CONFIG_DIR:-${HOME:-/tmp}/.brikko-studio}:/home/node/.brikko-studio
      - ${BRIKKO_STUDIO_WORKSPACE_DIR:-${HOME:-/tmp}/.brikko-studio/workspace}:/home/node/.brikko-studio/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - brikko-studio-gateway
