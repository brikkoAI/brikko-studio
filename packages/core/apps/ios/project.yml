name: Brikko Studio
options:
  bundleIdPrefix: ai.brikko-studio
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  Brikko StudioKit:
    path: ../shared/Brikko StudioKit
  Swabble:
    path: ../swabble

schemes:
  Brikko Studio:
    shared: true
    build:
      targets:
        Brikko Studio: all
    test:
      targets:
        - Brikko StudioTests
        - Brikko StudioLogicTests
  Brikko StudioLogicTests:
    shared: true
    build:
      targets:
        Brikko StudioLogicTests: all
    test:
      targets:
        - Brikko StudioLogicTests

targets:
  Brikko Studio:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: Brikko StudioShareExtension
        embed: true
      - target: Brikko StudioActivityWidget
        embed: true
      - target: Brikko StudioWatchApp
      - package: Brikko StudioKit
      - package: Brikko StudioKit
        product: Brikko StudioChatUI
      - package: Brikko StudioKit
        product: Brikko StudioProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchExtension,$SRCROOT/../shared/Brikko StudioKit,$SRCROOT/../swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/Brikko Studio.entitlements
        CODE_SIGN_STYLE: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRIKKO_STUDIO_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(BRIKKO_STUDIO_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          BRIKKO_STUDIO_PUSH_TRANSPORT: direct
          BRIKKO_STUDIO_PUSH_DISTRIBUTION: local
          BRIKKO_STUDIO_PUSH_RELAY_BASE_URL: ""
          BRIKKO_STUDIO_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          BRIKKO_STUDIO_PUSH_TRANSPORT: direct
          BRIKKO_STUDIO_PUSH_DISTRIBUTION: local
          BRIKKO_STUDIO_PUSH_RELAY_BASE_URL: ""
          BRIKKO_STUDIO_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Brikko Studio
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.brikko-studio.ios
            CFBundleURLSchemes:
              - brikko-studio
        CFBundleShortVersionString: "$(BRIKKO_STUDIO_MARKETING_VERSION)"
        Brikko StudioCanonicalVersion: "$(BRIKKO_STUDIO_IOS_VERSION)"
        CFBundleVersion: "$(BRIKKO_STUDIO_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.brikko-studio.ios.bgrefresh
        NSLocalNetworkUsageDescription: Brikko Studio discovers and connects to your Brikko Studio gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _brikko-studio-gw._tcp
        NSCameraUsageDescription: Brikko Studio can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: Brikko Studio uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Brikko Studio can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Brikko Studio needs microphone access for voice wake.
        NSMotionUsageDescription: Brikko Studio may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: Brikko Studio needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: Brikko Studio uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        Brikko StudioPushTransport: "$(BRIKKO_STUDIO_PUSH_TRANSPORT)"
        Brikko StudioPushDistribution: "$(BRIKKO_STUDIO_PUSH_DISTRIBUTION)"
        Brikko StudioPushRelayBaseURL: "$(BRIKKO_STUDIO_PUSH_RELAY_BASE_URL)"
        Brikko StudioPushAPNsEnvironment: "$(BRIKKO_STUDIO_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  Brikko StudioShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: Brikko StudioKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRIKKO_STUDIO_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(BRIKKO_STUDIO_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Brikko Studio Share
        CFBundleShortVersionString: "$(BRIKKO_STUDIO_MARKETING_VERSION)"
        CFBundleVersion: "$(BRIKKO_STUDIO_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  Brikko StudioActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/Brikko StudioActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRIKKO_STUDIO_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Brikko Studio Activity
        CFBundleShortVersionString: "$(BRIKKO_STUDIO_MARKETING_VERSION)"
        CFBundleVersion: "$(BRIKKO_STUDIO_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  Brikko StudioWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: Brikko StudioWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRIKKO_STUDIO_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(BRIKKO_STUDIO_WATCH_APP_PROFILE)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Brikko Studio
        CFBundleShortVersionString: "$(BRIKKO_STUDIO_MARKETING_VERSION)"
        CFBundleVersion: "$(BRIKKO_STUDIO_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(BRIKKO_STUDIO_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  Brikko StudioWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRIKKO_STUDIO_WATCH_EXTENSION_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(BRIKKO_STUDIO_WATCH_EXTENSION_PROFILE)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: Brikko Studio
        CFBundleShortVersionString: "$(BRIKKO_STUDIO_MARKETING_VERSION)"
        CFBundleVersion: "$(BRIKKO_STUDIO_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(BRIKKO_STUDIO_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  Brikko StudioTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: Brikko Studio
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.brikko-studio.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Brikko Studio.app/Brikko Studio"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: Brikko StudioTests
        CFBundleShortVersionString: "$(BRIKKO_STUDIO_MARKETING_VERSION)"
        CFBundleVersion: "$(BRIKKO_STUDIO_BUILD_VERSION)"

  Brikko StudioLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: Brikko StudioKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(BRIKKO_STUDIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BRIKKO_STUDIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.brikko-studio.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: Brikko StudioLogicTests
        CFBundleShortVersionString: "$(BRIKKO_STUDIO_MARKETING_VERSION)"
        CFBundleVersion: "$(BRIKKO_STUDIO_BUILD_VERSION)"
