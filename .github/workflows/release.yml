name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build + push to GHCR
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build + push studio-core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/core/Dockerfile
          push: true
          tags: |
            ghcr.io/brikkoai/studio-core:${{ steps.ver.outputs.version }}
            ghcr.io/brikkoai/studio-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/brikkoAI/brikko-studio
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build + push studio-anonymizer
        uses: docker/build-push-action@v5
        with:
          context: ./anonymizer
          file: anonymizer/Dockerfile
          push: true
          tags: |
            ghcr.io/brikkoai/studio-anonymizer:${{ steps.ver.outputs.version }}
            ghcr.io/brikkoai/studio-anonymizer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/brikkoAI/brikko-studio
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=MIT
