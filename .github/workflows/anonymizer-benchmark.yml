name: studio-anonymizer-benchmark

# Golden-corpus PII regression gate (M1 Task 17).
#
# The benchmark.py script runs the masker over the 50-doc golden corpus
# and emits per-category precision/recall/F1. check_regression.py compares
# the latest result against tests/pii_corpus/baseline.json and FAILS the
# build if recall dropped by more than 0.5 pp on any category.
#
# Adversarial corpus (Task 16) is non-blocking and runs separately from
# the unit-test suite — only THIS gate blocks PRs.

on:
  pull_request:
    paths:
      - "anonymizer/**"
      - ".github/workflows/anonymizer-benchmark.yml"
  push:
    branches: [main]

concurrency:
  group: anonymizer-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Golden corpus regression gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anonymizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: anonymizer/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run golden corpus benchmark
        run: |
          mkdir -p tests/pii_corpus/benchmark_results
          python tests/pii_corpus/benchmark.py \
            --corpus tests/pii_corpus/golden_corpus.jsonl \
            --out    tests/pii_corpus/benchmark_results

      - name: Locate latest benchmark result
        id: latest
        run: |
          latest=$(ls -t tests/pii_corpus/benchmark_results/*.json | head -1)
          echo "path=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest result: $latest"

      - name: Regression gate
        run: |
          python tests/pii_corpus/check_regression.py \
            --baseline tests/pii_corpus/baseline.json \
            --current  ${{ steps.latest.outputs.path }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymizer-benchmark-${{ github.run_id }}
          path: anonymizer/tests/pii_corpus/benchmark_results/
          retention-days: 30
